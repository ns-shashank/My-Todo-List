<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo App</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal">

  <div class="container mx-auto p-6">
    <h1 class="text-4xl font-bold text-center mb-8 text-blue-700">📝 My Todo List</h1>

    <form action="/add" method="POST" class="flex justify-center mb-6">
      <input name="task" type="text" placeholder="Enter a task" required
             class="shadow p-2 rounded-l-lg border w-1/2 outline-none">
      <button type="submit" class="bg-blue-600 text-white px-4 rounded-r-lg hover:bg-blue-700">
        Add
      </button>
    </form>

    <div class="max-w-2xl mx-auto bg-white shadow-md rounded-lg p-4">
        <ul>
            {% for task in tasks %}
              <li class="flex justify-between items-center py-2 border-b">
                <span class="{% if '[x]' in task %}line-through text-gray-500{% endif %}">
                  {{ loop.index }}. {{ task[4:].strip() }}
                </span>
                <div>
                  {% if '[ ]' in task %}
                  <a href="/done/{{ loop.index0 }}" class="text-green-600 hover:underline mr-4">Mark Done</a>
                  {% endif %}
                  <a href="/delete/{{ loop.index0 }}" class="text-red-600 hover:underline">Delete</a>
                </div>
              </li>
            {% endfor %}
          </ul>          
    </div>
  </div>
</body>
</html>
